name: Mirror to generico

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror to generico
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${MIRROR_TOKEN}@github.com/docuiai2026/docuia.git"
          git push --mirror origin
