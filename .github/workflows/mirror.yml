name: Mirror to generico

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror to generico
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: git push --mirror "https://x-access-token:${TOKEN}@github.com/docuiai2026/docuia.git"
